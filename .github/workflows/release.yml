name: Build and Release CarPlay PhoneCast

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Package Xcode ZIP and Android APK
        run: npm run package:release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist-release/CarPlayPhoneCast.apk
            dist-release/CarPlayPhoneCast_Xcode_Project.zip
          name: CarPlay PhoneCast Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
