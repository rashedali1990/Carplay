name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild -project CarPlayPhoneCast.xcodeproj \
            -scheme CarPlayPhoneCast \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r CarPlayPhoneCast-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarPlayPhoneCast-iOS-unsigned-ipa
          path: ios/CarPlayPhoneCast-unsigned.ipa
          retention-days: 14
