name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobachev/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Build unsigned .app
        run: |
          xcodebuild -scheme "اسم_الـ_Scheme_هنا" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Package to IPA
        run: |
          mkdir Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r my_app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: iOS-App
          path: my_app.ipa
