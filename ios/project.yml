name: CarPlayPhoneCast
options:
  bundleIdPrefix: com.carplay
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CarPlayPhoneCast:
    type: application
    platform: iOS
    sources:
      - path: CarPlayPhoneCast
        excludes:
          - "Tests/**"
          - "Configuration/Info.plist"
          - "Configuration/CarPlayPhoneCast.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.carplay.phonecast
        INFOPLIST_FILE: CarPlayPhoneCast/Configuration/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          # Entitlement is only applied when signing with a real profile (see workflow notes)
          CODE_SIGN_ENTITLEMENTS: ""
    scheme:
      testTargets: []
